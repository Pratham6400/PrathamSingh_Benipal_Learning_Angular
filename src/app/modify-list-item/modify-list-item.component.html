<!--lets start by creating form-->
<form [formGroup]="playerForm" (ngSubmit)="onSubmit()">

  <div class="forms">
    <label for="id">ID</label>
    <input type="number" id="id" formControlName="id" appHighlightOnFocus border="2px solid green"/>
  </div>

  <div class="forms">
    <label for="name">Name</label>
    <input type="text" id="name" formControlName="name" appHighlightOnFocus border="2px solid green"/>
  </div>

  <div class="forms">
    <label for="age">Age</label>
    <input type="number" id="age" formControlName="age" appHighlightOnFocus border="2px solid green"/>
  </div>

  <div class="forms">
    <label for="favSport">Favourite Sport</label>
    <input type="text" id="favSport" formControlName="favSport" appHighlightOnFocus border="2px solid green"/>
  </div>

  <div class="forms">
    <label for="benchPR">Bench PR</label>
    <input type="number" id="benchPR" formControlName="benchPR" appHighlightOnFocus border="2px solid green"/>
  </div>

  <div class="forms">
    <label for="favFood">Favourite Food</label>
    <input type="text" id="favFood" formControlName="favFood" appHighlightOnFocus border="2px solid green"/>
  </div>

<!--  lets add in the buttons now-->
  <button type="submit">Update</button>
  <button type="button" (click)="add()">Add</button>
  <button type="button" (click)="onDelete()">Delete</button>
  <button type="button" (click)="navigateToPlayerList()">Go back to Players list</button>


</form>
