<div *ngFor="let player of userList; index as i;" style="{{(i%2 == 0) ? 'background-color: red;' : 'background-color: grey;'}}">


  <app-player-list-item   [player]="player" [routerLink]="['/players',player.id ]"></app-player-list-item>
<!--  buttons-->
  <button (click)="editPlayer(player.id)">Edit Player</button>
  <button (click)="deletePlayer(player.id)">Delete Player</button>
</div>
